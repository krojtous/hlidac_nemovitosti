name: Hlídač nemovitostí (denně)

# Spouští se každý den ráno a také ručně tlačítkem "Run workflow".
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = cca 7:00 ráno v ČR
  workflow_dispatch: {}

# Aby si běh mohl commitnout aktualizovaná data zpět do repozitáře.
permissions:
  contents: write

concurrency:
  group: reality-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalace závislostí
        run: python -m pip install -r requirements.txt

      - name: Spuštění hlídače
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python run.py

      - name: Uložení dat zpět do repozitáře
        run: |
          git config user.name "reality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data.json
          if git diff --staged --quiet; then
            echo "Beze změn – není co commitovat."
          else
            git commit -m "Aktualizace nabídky $(date +%F)"
            git push
          fi
